name: Build and deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out approved branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Require verified apex domain before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28",
            },
          });
          if (!response.ok) throw new Error(`Could not verify Pages domain settings (HTTP ${response.status}).`);
          const pages = await response.json();
          if (pages.cname?.toLowerCase() !== "uateg.com") {
            throw new Error("Deployment stopped safely: configure uateg.com as the repository Pages custom domain first.");
          }
          if (pages.protected_domain_state !== "verified") {
            throw new Error("Deployment stopped safely: verify uateg.com in the GitHub account Pages settings first.");
          }
          console.log("Verified Pages apex domain is configured.");
          NODE
      - name: Install from lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Static export and public-data scan
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://uateg.com
        run: npm run build
      - name: Report artifact size
        shell: bash
        run: |
          size=$(du -sb out | cut -f1)
          echo "Static export size: ${size} bytes"
          test "$size" -lt 1073741824
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
